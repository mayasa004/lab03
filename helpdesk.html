<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="CWA Help Desk Appointment form for scheduling technical support sessions.">
    <meta name="keywords" content="CWA, help desk, appointment, technical support, IT assistance">
    <meta name="author" content="CWA Lab">
    <title>CWA Help Desk Appointment</title>
</head>
<body>
    <!-- HEADER -->
    <header>
        <!-- Logo hyperlinked to Swinburne website -->
        <a href="http://www.swin.edu.au">
            <img src="images/logo.png" alt="Swinburne University of Technology Logo" width="120" height="120">
        </a>

        <!-- Heading 1 -->
        <h1>CWA Help Desk Appointment</h1>

        <!-- Paragraphs -->
        <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday.</p>
        <p>Check Blackboard for when CWA tutors will be there.</p>
    </header>

    <!-- APPOINTMENT FORM -->
    <form action="#" method="post">

        <!-- Student Details -->
        <fieldset>
            <legend>Student details</legend>

            <!-- Student ID: required, exactly 7 to 10 digits -->
            <p>
                <label for="student-id">Student ID</label>
                <input type="text" id="student-id" name="student-id"
                       required
                       pattern="\d{7,10}"
                       title="Student ID must be between 7 and 10 digits.">
            </p>

            <!-- Given Name: required, max 15 chars, alphabetic only -->
            <p>
                <label for="given-name">Given Name</label>
                <input type="text" id="given-name" name="given-name"
                       required
                       maxlength="15"
                       pattern="[A-Za-z]+"
                       title="Given name must contain only alphabetical characters (max 15).">

                <!-- Family Name: required, max 15 chars, alphabetic only -->
                <label for="family-name">Family Name</label>
                <input type="text" id="family-name" name="family-name"
                       required
                       maxlength="15"
                       pattern="[A-Za-z]+"
                       title="Family name must contain only alphabetical characters (max 15).">
            </p>
        </fieldset>

        <!-- Your Unit -->
        <fieldset>
            <legend>Your unit</legend>

            <!-- Radio group: at least one required -->
            <p>
                <input type="radio" id="cos10011" name="unit" value="COS10011" required>
                <label for="cos10011">COS10011</label>

                <input type="radio" id="cos60004" name="unit" value="COS60004">
                <label for="cos60004">COS60004</label>

                <input type="radio" id="cos60007" name="unit" value="COS60007">
                <label for="cos60007">COS60007</label>
            </p>

            <!-- Tutor dropdown: required, first option empty string -->
            <p>
                <label for="tutor">Your Tutor</label>
                <select id="tutor" name="tutor" required>
                    <option value="">Please Select</option>
                    <option value="dr-smith">Dr. Smith</option>
                    <option value="prof-jones">Prof. Jones</option>
                    <option value="dr-lee">Dr. Lee</option>
                    <option value="ms-taylor">Ms. Taylor</option>
                    <option value="mr-brown">Mr. Brown</option>
                </select>
            </p>
        </fieldset>

        <!-- Issue -->
        <fieldset>
            <legend>Issue</legend>

            <!-- Checkboxes: HTML checked by default -->
            <p>
                <input type="checkbox" id="html" name="issue-html" value="HTML" checked>
                <label for="html">HTML</label>

                <input type="checkbox" id="css" name="issue-css" value="CSS">
                <label for="css">CSS</label>

                <input type="checkbox" id="javascript" name="issue-javascript" value="JavaScript">
                <label for="javascript">JavaScript</label>

                <input type="checkbox" id="php" name="issue-php" value="PHP">
                <label for="php">PHP</label>

                <input type="checkbox" id="mysql" name="issue-mysql" value="MySQL">
                <label for="mysql">MySQL</label>
            </p>

            <!-- Description of Issue: placeholder prompt, required -->
            <p>
                <label for="description">Description of Issue</label><br>
                <textarea id="description" name="description"
                          rows="5" cols="50"
                          placeholder="Write description of your problem here..."
                          required></textarea>
            </p>
        </fieldset>

        <!-- Preferred Date / Time -->
        <fieldset>
            <legend>Preferred Date / Time</legend>

            <!-- Date & Time: text + pattern so placeholder shows in Firefox and Chrome -->
            <p>
                <label for="date">Date</label>
                <input type="text" id="date" name="date"
                       placeholder="dd/mm/yyyy"
                       pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/\d{4}"
                       title="Please enter the date as dd/mm/yyyy"
                       required>
            </p>

            <p>
                <label for="time">Time</label>
                <input type="text" id="time" name="time"
                       placeholder="00:00"
                       pattern="([01][0-9]|2[0-3]):[0-5][0-9]"
                       title="Please enter the time as HH:MM (24-hour)"
                       required>
            </p>
        </fieldset>

        <!-- Buttons -->
        <p>
            <button type="submit">Book</button>
            <button type="reset">Reset form</button>
        </p>
    </form>
</body>
</html>
